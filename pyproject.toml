[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auv_pose"
version = "0.1.0"
description = "Terrain-aided pose estimation for an underwater vehicle"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "gpytorch",
    # BathymetryMap holds a StandardScaler, so loading a map needs sklearn.
    "scikit-learn",
    # KDTree, for the octree's residuals and for the Vecchia map's ordering,
    # neighbour sets and queries. It was already a runtime dependency through
    # octree.py and merely absent from this list; the Vecchia map made that
    # too load-bearing to leave undeclared. Imported lazily at the call sites,
    # so the flake's pythonImportsCheck does not need it either way.
    "scipy",
]

[project.optional-dependencies]
# Used by experiments/, not by the auv_pose package itself.
experiments = ["matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["auv_pose*"]

[tool.pytest.ini_options]
# Only tests/. experiments/ contains scripts that call holoocean.make() at import
# time -- collecting them would try to launch the Unreal simulator.
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::RuntimeWarning",
]
